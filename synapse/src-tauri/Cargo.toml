[package]
name = "synapse"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "synapse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
parakeet-rs = "0.3"
cpal = "0.15"
enigo = "0.6"
xcap = "0.9"
chrono = "0.4"
dirs = "5"
reqwest = { version = "0.13", features = ["blocking", "json"] }
# The platform-store feature is NOT optional: with no store feature keyring
# silently compiles in its in-memory `mock` store, which hands out a fresh
# empty credential per `Entry::new` — so saving an API key appears to succeed
# and reading it back always returns NoEntry. Features are per-target below.
keyring = "3"
rodio = "0.19"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
mockito = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # GetAsyncKeyState, to confirm the mouse button is still physically down
    # before handing a window drag to the OS move loop.
    "Win32_UI_Input_KeyboardAndMouse",
    # GetClipboardSequenceNumber, for the clipboard-history watcher.
    "Win32_System_DataExchange",
] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
keyring = { version = "3", features = ["apple-native"] }

