name: Progress log

on: pull_request

permissions:
  contents: read

jobs:
  reminder:
    name: PROGRESS.md updated?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PROGRESS.md is this repo's stated source of truth for project status, and
      # the next session starts by reading it. This is a nudge, never a blocker —
      # it writes to the job summary and always exits 0.
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          touched_code=$(echo "$changed" | grep -E '^synapse/(src|src-tauri/src)/' || true)
          touched_log=$(echo "$changed" | grep -x 'PROGRESS.md' || true)

          if [ -n "$touched_code" ] && [ -z "$touched_log" ]; then
            {
              echo "### PROGRESS.md was not updated"
              echo ""
              echo "This PR changes app source but leaves the session log untouched."
              echo "If the change is worth a future session knowing about, add a line."
              echo ""
              echo "<details><summary>Source files changed</summary>"
              echo ""
              echo '```'
              echo "$touched_code"
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### PROGRESS.md check: nothing to flag" >> "$GITHUB_STEP_SUMMARY"
          fi
