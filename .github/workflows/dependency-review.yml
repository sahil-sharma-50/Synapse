name: Dependency review

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Flags newly introduced vulnerable or awkwardly licensed dependencies at
      # the moment they are added, which is the only cheap time to reconsider.
      #
      # Advisory for now, like cargo audit: the action hard-errors unless
      # Dependency graph is enabled for the repo
      # (Settings > Code security > Dependency graph), and a check that is red
      # for a reason no PR author can fix just trains people to ignore red.
      # Drop continue-on-error once the setting is on.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
