name: Dependency review

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Flags newly introduced vulnerable or awkwardly licensed dependencies at
      # the moment they are added, which is the only cheap time to reconsider.
      #
      # The action needs Dependency graph, which is always on for public repos
      # and cannot be turned off — so it can fail for real here. It is not a
      # required check: a new high-severity advisory should be loud without
      # blocking work that has nothing to do with it.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
